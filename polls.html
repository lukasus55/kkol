<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Karwińska Olimpiada - Ankiety.">
    <link rel="shortcut icon" href="/img/logos/icon.png" type="image/x-icon">
    <title> Olimpiada Karwińska - Ankiety</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/dashboard/dashboard.css">
    <link rel="stylesheet" href="/css/polls.css">
</head>

<body>

    <main>
        <div class="poll">

            <div class="poll_header">
                <div class="poll_header_row">
                    <div class="poll_name">Poll Name</div>
                    <div class="poll_buttons">
                        <div class="poll_labels_list_section">
                            <button class="btn_secondary btn_menu_toggler" id="btn_toggle_labels_menu"><img src="img/polls/label.svg"> Etykiety</button>
                            <div class="poll_labels_list_container poll_action_menu hidden" id="poll_labels_list_container">
                                <div class="poll_labels_list" id="poll_labels_list">
                                    <!-- renderHeader() inserts here -->
                                </div>
                                <div class="poll_labels_list_new" id="poll_labels_list_new"> <img src="/img/polls/plusWhite.svg"> Stwórz nową</div>
                            </div>

                        </div>
                        <button class="btn_primary" id="btn_new_question"><img src="img/polls/plus.svg"> Dodaj</button>
                    </div>
                </div>
                <div class="poll_header_row">
                    <div class="poll_date"><img src="img/polls/clock.svg"> Koniec <span class="poll_date_relative" id="poll_date_relative">-</span></div>
                </div>
            </div>

            <div class="poll_container">
                Work In Progress
            </div>
            

        </div>
    </main>


    <footer class="footer" id="footer">
        <div id="common-footer"></div>
    </footer>

    <!-- footer.html and footer.js loading script -->
    <script src="/js/footer-loader.js"></script>

    <script type="module" src="/js/polls.js"></script>
</body>
