<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Karwińska Olimpiada - Logowanie">
    <link rel="shortcut icon" href="/img/logos/icon.png" type="image/x-icon">
    <title> Olimpiada Karwińska - Logowanie</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css//dashboard/dashboard.css">
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>

    <header class="login_header">
        <div class="title_section">
            <img src="/img/logos/olympic-logo-transparent.svg" style="width: 4rem; height: 4rem">
            <div class="title_text">
                <div class="title_line">Karwińska</div>
                <div class="title_line">Olimpiada</div>
            </div>
        </div>
    </header>

    <main class="login_main">
        <div class="login_container">

            <div class="login_card">
                <h1> Zaloguj się </h1>
                <form action="/login" method="POST" class="login_form" id="login_form">
                    
                    <div class="input_group">
                        <label for="username">Nazwa użytkownika</label>
                        <input type="text" id="username" name="username" placeholder="Wprowadź nazwę użytkownika" required autocomplete="username">
                    </div>

                    <div class="input_group">
                        <label for="password">Hasło</label>
                        <input type="password" id="password" name="current_password" placeholder="Wprowadź swoje hasło" required autocomplete="current-password">
                    </div>

                    <div class="login_failed hiddenInstant"> Niepoprawna nazwa użytkownika lub hasło </div>

                    <div class="card_footer">
                        <div class="disclaimer">
                            <button type="button" class="btn_question" id="question-acc"> Nie masz konta? </button>
                            <button type="button" class="btn_question" id="question-forgot"> Zapomniałeś hasła? </button>
                        </div>

                        <button type="submit" class="btn_primary">Zaloguj się</button>
                    </div>
                </form>
            </div>

            <div class="login_card answer_card hidden" id="answer">
                <div class="answer_title"></div>
                <span class="answer_content"></span>
            </div>

        </div>
    </main>

    <footer class="footer" id="footer">
        <div id="common-footer"></div>
    </footer>

    <script type="module" src="/js/login.js"></script>

    <!-- footer.html and footer.js loading script -->
    <script src="/js/footer-loader.js"></script>

</body>
