<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=yes">
    <meta name="description" content="Karwińska Olimpiada - Ankiety.">
    <link rel="shortcut icon" href="/img/logos/icon.png" type="image/x-icon">
    <title> Olimpiada Karwińska - Ankiety</title>

    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/dashboard/dashboard.css">
    <link rel="stylesheet" href="/css/poll.css">
</head>

<body>

    <main>
        <div class="poll">

            <div class="poll_header">
                <div class="poll_header_row">
                    <div class="poll_name" id="poll_name">Poll Name</div>
                    <div class="poll_buttons">
                        <div class="poll_labels_list_section">
                            <button class="btn_secondary btn_menu_toggler" id="btn_toggle_labels_menu"><img src="img/polls/label.svg"> Etykiety</button>
                            <div class="poll_labels_list_container poll_action_menu hidden" id="poll_labels_list_container">
                                <div class="poll_labels_list" id="poll_labels_list">
                                    <!-- renderHeader() inserts here -->
                                </div>
                                <div class="poll_labels_list_new" id="poll_labels_list_new"> <img src="/img/polls/plusWhite.svg"> Utwórz etykietę</div>
                            </div>

                        </div>
                        <button class="btn_primary" id="btn_new_question"><img src="img/polls/plus.svg"> Utwórz pytanie</button>
                    </div>
                </div>
                <div class="poll_header_row">
                    <div class="poll_date"><img src="img/polls/clock.svg"> Koniec <span class="poll_date_relative" id="poll_date_relative">-</span></div>
                </div>
            </div>

            <div class="poll_container">
                Work In Progress
            </div>
            

        </div>
    </main>

    <div class="popup_overlay" id="popup_label_editor">
        <div class="popup_container poll_popup">
            <div class="label_editor" id="label_editor">
                <div class="label_editor_header">
                    <span id="label_editor_title">Edytuj etykietę</span>
                    <button class="poll_btn_close poll_btn_x"><img src="/img/polls/close.svg"></button>
                </div>
                <div class="label_editor_main">
                    <div class="label_editor_badge_container">
                        <div class="label_editor_badge" id="label_editor_badge">prio</div>
                    </div>
                    <div class="label_editor_form">
                        <label>Nazwa</label>
                        <input autocomplete="off" type="text" id="label_edit_name" placeholder="Nazwa etykiety" class="poll_input">
                        <label>Opis</label>
                        <textarea id="label_edit_desc"  placeholder="Opcjonalnie dodaj opis etykiety" class="poll_input poll_input_tall"></textarea>
                        <label>Kolor</label>
                        <div class="label_edit_color_section">
                            <button class="label_color_rect" id="label_color_rect"><img src='/img/polls/refresh.svg'></button>
                            <input autocomplete="off" type="text" id="label_edit_color" class="poll_input poll_input_narrow">
                        </div>
                    </div>
                </div>
                <div class="label_editor_footer">
                    <button id="btn_delete_label" class="btn_delete btn_label_editor">Usuń</button>
                    <div class="label_editor_footer_row">
                        <button class="poll_btn_close btn_cancel btn_tertiary btn_label_editor">Anuluj</button>
                        <button id="btn_save_label" class="btn_primary btn_label_editor">Zapisz</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="popup_overlay" id="confirmation_popup">
        <div class="popup_container">
            
            <div class="popup_icon">
                <img src="/img/dashboard/warning_icon.webp">
            </div>

            <div class="popup_body">
                <p id="confirmation_popup_message">Czy na pewno chcesz to zrobić?</p>
            </div>

            <div class="popup_footer">
                <button class="btn btn_cancel poll_btn_close" id="confirmation_popup_cancel">Anuluj</button>
                <button class="btn btn_confirm" id="confirmation_popup_confirm">Potwierdź</button>
            </div>
        </div>
    </div>


    <footer class="footer" id="footer">
        <div id="common-footer"></div>
    </footer>

    <!-- footer.html and footer.js loading script -->
    <script src="/js/footer-loader.js"></script>

    <script type="module" src="/js/poll.js"></script>
</body>
